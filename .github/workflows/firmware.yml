# .github/workflows/firmware.yml
name: Firmware Build & Verify

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'

jobs:
  verify-and-build:
    name: Lint, Analyze & Compile
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 📜 CHANGED: Swapped out the deleted repo for the active community alternative
      - name: Install ARM GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Install Linting & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-format cppcheck

      - name: Execute Static Checks and Compilation
        run: |
          cd firmware
          chmod +x build.sh
          ./build.sh

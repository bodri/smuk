[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smuk-desktop"
version = "0.1.0"
description = "Desktop measurement console for the SMUK source measure unit"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.10,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
packaging = ["pyinstaller>=6.17,<7"]

[project.scripts]
smuk-desktop = "smuk_desktop.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smuk_desktop = ["resources/*.qss", "resources/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
